# Tests and lint run on pushes to main and on every pull request.
# After tests pass on main, a Docker image is published to ghcr.io
# deployed to staging, and then (after approval) to production on Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Run the same job on several Node versions (a "matrix build").
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

  lint:
    # Style and bug checks only need to run once, not on every Node version.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  docker:
    # Only start once every test job and the lint job have passed.
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image pinned by digest, e.g. ghcr.io/owner/repo@sha256:...
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests only check that the image builds; nothing is published.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: Record the image reference
        id: ref
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # Every push to main goes to staging first...
  deploy-staging:
    needs: docker
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}
      sha: ${{ github.sha }}
    secrets: inherit

  # ...then waits for approval (a required reviewer on the production
  # environment) and ships the exact same image to production.
  deploy-production:
    needs: [docker, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}
      sha: ${{ github.sha }}
    secrets: inherit

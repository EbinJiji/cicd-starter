# Tests and lint run on pushes to main and on every pull request.
# After tests pass on main, a Docker image is published to ghcr.io
# and deployed to Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Run the same job on several Node versions (a "matrix build").
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

  lint:
    # Style and bug checks only need to run once, not on every Node version.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  docker:
    # Only start once every test job and the lint job have passed.
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests only check that the image builds; nothing is published.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_URL }}

    steps:
      # Deploy the exact image built above (by digest), not whatever "latest" is.
      - name: Trigger deploy on Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          echo "Deploying $image"
          curl -fsS -X POST "$DEPLOY_HOOK&imgURL=$(jq -rn --arg v "$image" '$v|@uri')"

      # Render deploys in the background, so poll until the new commit is live.
      - name: Wait for the new version to go live
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          for i in $(seq 1 40); do
            version=$(curl -fsS "$URL/health" | jq -r .version) || version=""
            echo "Attempt $i: live version is ${version:-unreachable}"
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Deployed successfully"
              exit 0
            fi
            sleep 15
          done
          echo "New version did not go live within 10 minutes"
          exit 1
